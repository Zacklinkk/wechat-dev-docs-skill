name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run test suite
        run: >-
          uv run --with pytest --with httpx --with beautifulsoup4 --with markdownify
          pytest tests/ -v
